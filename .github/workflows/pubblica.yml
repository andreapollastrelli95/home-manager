# Pubblica su GitHub Pages:
#  - alla radice  → l'APP CON ACCOUNT (Supabase), se i "secrets" sono configurati;
#  - in /demo/    → la demo con dati fittizi (senza secrets la demo resta alla radice).
# Prima volta: Settings → Pages → Build and deployment → Source = "GitHub Actions".
# Secrets/variabili: Settings → Secrets and variables → Actions (vedi docs/configurazione-supabase.md).
name: Pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # Con i secret Supabase: l'app con account alla radice e la demo in /demo/.
      # Senza secret: solo la demo alla radice (la chiave "anon" è pubblica per progettazione).
      - name: Compila e prepara il sito
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PASSWORD_RESET_ENABLED: ${{ vars.VITE_PASSWORD_RESET_ENABLED }}
        run: |
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            VITE_DEMO_URL=./demo/ npx vite build --outDir _site
            npx vite build --mode demo --outDir _site/demo
            echo "App con account alla radice, demo in /demo/"
          else
            npx vite build --mode demo --outDir _site
            echo "::warning::Secrets Supabase non configurati: pubblico solo la demo. Vedi docs/configurazione-supabase.md"
          fi
      - run: touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
